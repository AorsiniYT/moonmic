name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build/tests -G Ninja
          -DBUILD_CLIENT=OFF
          -DMOONMIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/tests --parallel

      - name: Test
        run: ctest --test-dir build/tests --output-on-failure
